:root{--wine:#8a2547;--dark:#57192f;--ink:#30242a;--muted:#72676c;--line:#e7dfe2;--tint:#f9f2f4;--paper:white;--serif:"Atelier Fleur","LM Roman Display","Bodoni MT",Didot,"Times New Roman",serif;font:16px/1.48 "Segoe UI",Arial,sans-serif;color:var(--ink);background:white}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c47794;outline-offset:3px}h1,h2,h3,.brand,.number{font-family:var(--serif);font-weight:400;line-height:1.04;margin:0;letter-spacing:-.047em}h1{font-size:clamp(3rem,4.8vw,4.9rem)}h2{font-size:2rem}h3{font-size:1.65rem}p{margin:.5rem 0}.icon{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linejoin:round;stroke-linecap:round}.row,.button,.nav,.brand,.smallbtn,.tab,.footnote{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.quiet,.meta{color:var(--muted)}.meta{font-size:.85rem}.eyebrow{font-size:.76rem;letter-spacing:.13em;font-weight:650;text-transform:uppercase}.button,.smallbtn{justify-content:center;border-radius:8px;font-weight:600}.button{padding:11px 17px;background:var(--wine);color:white;min-height:44px}.button:hover{background:var(--dark)}.button.secondary,.smallbtn{background:white;color:var(--wine);border:1px solid var(--line)}.smallbtn{padding:7px 11px;font-size:.88rem}.bare,.textact{color:var(--wine);font-weight:600}.bare{padding:6px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}.bare:hover,.smallbtn:hover,.textact:hover{background:var(--tint)}.textact{padding:5px 8px;font-size:.9rem;border-radius:5px}.shell{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}aside{background:#fbf8f9;border-right:1px solid var(--line);padding:33px 18px 22px;display:flex;flex-direction:column;min-width:0;position:sticky;top:0;height:100dvh;overflow:auto}.brand{color:var(--dark);font-size:2.05rem;white-space:nowrap;gap:9px;padding:0 5px}.logo{width:35px;height:39px;flex:none}.sideblock{margin-top:38px}.sidehead{padding:0 12px;margin-bottom:12px;color:var(--muted)}.nav{font-size:.95rem;text-align:left;width:100%;padding:10px 13px;border-radius:7px;margin:3px 0}.nav:hover{background:#f4eaee}.nav.active{background:#efdee5;color:var(--wine);font-weight:650}.nav span.trunc{flex:1}.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebottom{margin-top:auto;padding-top:28px}.sidebottom hr{border:0;border-top:1px solid var(--line);margin:12px 9px}.footnote{font-size:.8rem;color:var(--muted);margin:12px}.content{width:100%;max-width:1520px;margin:auto;padding:43px clamp(25px,4vw,76px) 60px;align-self:start;margin-top:0}.heading{margin:14px 0 28px;gap:18px}.today{color:var(--wine)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:36px}.stat{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:14px;padding:19px 21px 15px;min-height:135px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}.stat:first-child{background:var(--wine);border-color:var(--wine);color:white}.stat:first-child:after{content:"";position:absolute;width:190px;height:190px;right:-125px;bottom:-135px;border:1px solid #ffffff3a;border-radius:50%;box-shadow:0 0 0 13px #ffffff0b,0 0 0 14px #ffffff29,0 0 0 28px #ffffff0a,0 0 0 29px #ffffff23,0 0 0 44px #ffffff08,0 0 0 45px #ffffff20;z-index:-1}.stat:nth-child(2){background:#fbf3f5}.stat .number{font-size:3.4rem}.stat .row{font-size:.95rem;font-weight:600}.stat .icon{opacity:.8}.stat:hover{box-shadow:0 2px 9px #57192f15}.columns{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(250px,1fr);gap:clamp(18px,2.7vw,42px);align-items:start}.sectionhead{margin-bottom:18px}.tabs{gap:4px;display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:0}.tab{padding:8px 8px 10px;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent}.tab.on{border-color:var(--wine);color:var(--wine);font-weight:650}.empty{text-align:center;padding:35px 15px 30px;border:1px dashed #d8c4cc;background:#fdfafb;border-radius:12px;margin:18px 0}.empty h3{margin:13px 0 5px}.empty .button{margin:16px auto 0}.leaf{display:block;width:70px;height:60px;margin:auto;color:var(--wine)}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:white}.calhead{margin:12px 0 10px;font-weight:650}.calhead .bare{padding:4px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;align-items:center;gap:3px 0}.weekday{color:var(--muted);font-size:.75rem;padding:4px 0}.day{position:relative;display:grid;place-items:center;margin:1px auto;width:30px;height:30px;border-radius:50%;font-size:.87rem;padding:0}.day.now{background:var(--wine);color:white}.day.mark:after{content:"";position:absolute;bottom:1px;width:4px;height:4px;background:var(--wine);border-radius:50%}.day.now.mark:after{background:white}button.day:hover{outline:1px solid var(--wine)}.deadlinefoot{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.taskrow,.groupitem{display:flex;gap:12px;align-items:center;width:100%;padding:16px 2px;text-align:left;border-bottom:1px solid var(--line)}.taskrow:hover,.groupitem:hover{background:#fbf8f9}.taskrow strong,.groupitem strong{display:block;overflow-wrap:anywhere}.taskrow .meta{margin-top:3px}.pill{border-radius:20px;background:var(--tint);color:var(--wine);padding:3px 9px;font-size:.76rem;white-space:nowrap}.pill.overdue{background:#f5dfe6;color:#791a3d}.pill.completed{background:#eeeef0;color:#534d50}.toolrow{margin-bottom:16px}.field{display:grid;gap:6px;font-size:.91rem;font-weight:600;margin:15px 0}.field input,.field select,.entry{width:100%;min-width:0;background:white;border:1px solid #cdbdc4;border-radius:7px;padding:10px 12px;font-weight:400}.bar{height:5px;background:#eee6e9;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;background:var(--wine);height:100%}.subrow{padding:12px 0;border-top:1px solid var(--line)}.subrow label{display:flex;gap:10px;align-items:b const ui={page:'overview',scope:'',group:'',filter:'All',query:'',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),date:'',task:''};

}

}

  return '<div class="scope"><label for="groupscope">Show group</label><select class="entry" id="groupscope"><option value="">All groups</option>'+
    data.groups.map(g=>'<option value="'+g.id+'" '+(g.id===ui.scope?'selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></div>';

    const remove=inline?ib('deletesub','Delete subtask','x',s.id):'';

      (t.subs.length?'<div class="checkpanel overview-checks">'+summary+subRows(t,true)+'</div>':'')+
      '</article>';

}

function calEscape(s){return s.replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}

function ics(ts){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Task Tracker//Offline//EN','CALSCALE:GREGORIAN'];const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');for(const t of ts){const end=asDate(t.due);end.setDate(end.getDate()+1);lines.push('BEGIN:VEVENT','UID:'+t.id+'@task-tracker.local','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+t.due.replaceAll('-',''),'DTEND;VALUE=DATE:'+daykey(end).replaceAll('-',''),'SUMMARY:'+calEscape(t.name),'DESCRIPTION:'+calEscape('Group: '+grp(t.group).name),'TRANSP:TRANSPARENT','END:VEVENT')}return lines.concat('END:VCALENDAR').map(fold).join('\r\n')+'\r\n'}

function as64(blob){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no(r.error);r.readAsDataURL(blob)})}
async function backup(){const tx=db.transaction(['state','proof']),s=tx.objectStore('proof');const [state,keys,blobs]=await Promise.all([request(tx.objectStore('state').get('workspace')),request(s.getAllKeys()),request(s.getAll())]);const files=await Promise.all(blobs.map(async(f,i)=>({id:keys[i],base64:await as64(f)})));download(new Blob([JSON.stringify({format:'TaskTracker-1',data:state||{groups:[],tasks:[]},files})],{type:'application/json'}),'Task-Tracker-backup-'+today()+'.json')}
function validPackage(pkg){const bad=()=>{throw Error('Choose a valid Task Tracker backup containing all its PDF proof.')};if(pkg?.format!=='TaskTracker-1'||!Array.isArray(pkg.files)||!Array.isArray(pkg.data?.groups)||!Array.isArray(pkg.data?.tasks))bad();const seen=new Set(),groups=new Set(),proof=new Set(),files=new Map();function record(x,max){if(!x||!/^[-a-f0-9]{36}$/i.test(x.id)||seen.has(x.id)||typeof x.name!=='string'||!x.name.trim()||x.name.length>max)bad();seen.add(x.id)}for(const g of pkg.data.groups){record(g,100);groups.add(g.id)}for(const t of pkg.data.tasks){record(t,200);if(t.priority!==undefined&&t.priority!==''&&!priorityLevels.includes(t.priority))bad();if(!groups.has(t.group)||!Array.isArray(t.subs)||typeof t.done!=='boolean'||typeof t.due!=='string'||t.due&&(!/^\d{4}-\d\d-\d\d$/.test(t.due)||daykey(asDate(t.due))!==t.due))bad();for(const s of t.subs){record(s,200);if(typeof s.done!=='boolean'||typeof s.proof!=='string')bad();if(s.proof)proof.add(s.id)}}for(const f of pkg.files){if(!proof.delete(f.id)||typeof f.base64!=='string')bad();const str=atob(f.base64);if(!str.startsWith('%PDF-'))bad();files.set(f.id,new Blob([Uint8Array.from(str,c=>c.charCodeAt(0))],{type:'application/pdf'}))}if(proof.size)bad();
const validDate=s=>s===undefined||s===''||(typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&daykey(asDate(s))===s);
for(const o of [...pkg.data.groups,...pkg.data.tasks]){
  if(!validDate(o.start)||!validDate(o.due)||(o.start&&o.due&&o.due<o.start)||(o.closed!==undefined&&typeof o.closed!=='boolean'))bad();
}
for(const t of pkg.data.tasks)for(const o of [t,...t.subs])if(o.remark!==undefined&&(typeof o.remark!=='string'||o.remark.length>4000))bad();
return {data:pkg.data,files}}

async function combineTrees(local,incoming,proofs,newProofs,bytes,makeId){
  const all=d=>[...d.groups,...d.tasks,...d.tasks.flatMap(t=>t.subs)];
  const used=new Set([...all(local).map(r=>r.id),...proofs.keys()]);
  const reserved=new Set(all(incoming).map(r=>r.id));
  const origin=r=>r.mergeOrigin||r.id;
  const alias=(name,max)=>name.slice(0,max-11)+' (imported)';
  const nameOf=(r,max)=>r.mergeName&&r.name===alias(r.mergeName,max)?r.mergeName:r.name;
  const writes=new Map(),result={groups:0,tasks:0,subtasks:0,copies:0};

  async function take(rows,r,keys,max,type,extra,equalProof){
    for(const x of rows){
      if(origin(x)!==origin(r)||nameOf(x,max)!==nameOf(r,max))continue;
      if(!keys.every(k=>(x[k]??'')===(r[k]??'')))continue;
      if(equalProof && !(await equalProof(x)))continue;
      return x;
    }
    const x={...r,...extra};
    if(used.has(x.id)){
      do{x.id=makeId()}while(used.has(x.id)||reserved.has(x.id));
      x.mergeOrigin=origin(r);
      x.mergeName=nameOf(r,max);
      x.name=alias(x.mergeName,max);
      result.copies++;
    }
    used.add(x.id);
    rows.push(x);
    result[type]++;
    if(type==='subtasks'&&r.proof){
      const blob=newProofs.get(r.id);
      proofs.set(x.id,blob);
      writes.set(x.id,blob);
    }
    return x;
  }

  const groupMap=new Map();
  for(const g of incoming.groups){
    const target=await take(local.groups,g,['start','due','closed'],100,'groups',{});
    groupMap.set(g.id,target);
  }
  for(const t of incoming.tasks){
    const gid=groupMap.get(t.group).id;
    const peers=local.tasks.filter(x=>x.group===gid);
    const previousCount=peers.length;
    const target=await take(peers,t,['start','due','priority','remark','closed'],
      200,'tasks',{group:gid,subs:[]});
    if(peers.length>previousCount)local.tasks.push(target);
    for(const s of t.subs){
      await take(target.subs,s,['remark','done','proof'],200,'subtasks',{},async x=>{
        if(!s.proof)return true;
        const a=proofs.get(x.id),b=newProofs.get(s.id);
        return !!a&&!!b&&a.size===b.size&&(await bytes(a))===(await bytes(b));
      });
    }
  }
  return {writes,result};
}

async function mergeWorkspace(pkg){
  const snapshot=db.transaction(['state','proof'],'readonly');
  const attachments=snapshot.objectStore('proof');
  const [state,keys,blobs]=await Promise.all([
    request(snapshot.objectStore('state').get('workspace')),
    request(attachments.getAllKeys()),request(attachments.getAll())
  ]);
  const local=reconcile(state||{groups:[],tasks:[]});
  const before=JSON.stringify(local);
  const proofs=new Map(keys.map((key,i)=>[key,blobs[i]]));
  const cache=new WeakMap();
  function bytes(blob){
    if(!cache.has(blob))cache.set(blob,as64(blob));
    return cache.get(blob);
  }
  const plan=await combineTrees(local,reconcile(structuredClone(pkg.data)),
    proofs,pkg.files,bytes,uid);
  await change((current,store)=>{
    if(JSON.stringify(current)!==before)
      throw Error('The workspace changed during the merge. Select Merge backup again to retry.');
    current.groups=local.groups;
    current.tasks=local.tasks;
    for(const [key,blob] of plan.writes)store.add(blob,key);
  });
  return plan.result;
}

function chooseMergeBackup(){
  picker('.json,application/json',async file=>{
    let parsed;
    try{parsed=JSON.parse(await file.text())}
    catch{throw Error('Choose a Task Tracker JSON backup.')}
    pendingBackup=validPackage(parsed);
    const count=parsed.data.tasks.length;
    confirmBox('Merge backup?',
      'This backup contains '+count+' main task'+(count===1?'':'s')+
      '. Keep existing records, add missing work, and retain both versions of conflicting edits.',
      'mergeconfirm','','backup','','Merge backup');
  });
}

async function finishMerge(){
  if(!pendingBackup)return;
  const r=await mergeWorkspace(pendingBackup);
  pendingBackup=null;
  navigate('overview');
  const added=r.groups+r.tasks+r.subtasks;
  const note=added?'Added '+r.groups+' groups, '+r.tasks+' tasks and '+r.subtasks+
    ' subtasks. Conflicting records kept as imported copies: '+r.copies+'.':
    'Everything in this backup is already on this device.';
  show('Merge complete','<p class="spaced">'+note+'</p><div class="actions row">'+
    btn('close','Done','button')+'</div>');
}

async function act(a,id,parent){

  await change(d=>{

case 'deletetask':confirmBox('Delete task?','This removes the task, its subtasks, and their PDF proof.','droptask',id,'task',id,'Delete task');break;
case 'droptask':await change((d,st)=>{const t=freshTask(d,id);for(const s of t.subs)st.delete(s.id);d.tasks=d.tasks.filter(t=>t.id!==id)});dialog.close();break;
case 'deletesub':confirmBox('Delete subtask?','This removes the subtask and its attached proof.','dropsub',id,parent?'close':'editsub',id,'Delete subtask');break;

case 'deletegroup':if(data.tasks.some(t=>t.group===id))throw Error('Move or delete the tasks in this group first.');confirmBox('Delete group?','Remove this empty group from your workspace?','dropgroup',id,'editgroup',id,'Delete group');break;

  const b=e.target.closest('[data-act]');if(b)run(()=>act(b.dataset.act,b.dataset.id,b.closest('.taskcard')?.dataset.task))});
$('#menutoggle').onclick=()=>{const open=$('#side').classList.toggle('open');$('#menutoggle').setAttribute('aria-expanded',String(open))};
document.addEventListener('change',e=>{if(e.target.id==='groupscope'){ui.scope=e.target.value;ui.date='';ui.filter='All';render();$('#groupscope').focus();return}if(e.target.name==='group'&&e.target.form?.id==='taskform'){const on=e.target.value==='new';$('#newgroupfield').hidden=!on;$('#newgroupfield input').required=on}if(e.target.matches('[data-toggle]')){const id=e.target.dataset.toggle,done=e.target.checked,card=e.target.closest('.taskcard'),tid=card?card.dataset.task:ui.task;
    run(async()=>{await change(d=>{freshSub(freshTask(d,tid),id).done=done});
      if(!card)detail(tid);
      (card?$('#main'):dialog).querySelector('[data-toggle="'+id+'"]')?.focus({preventScroll:true});
    })}});
document.addEventListener('input',e=>{if(e.target.form?.matches('.inlineadd'))inlineDrafts.set(e.target.form.dataset.parent,e.target.value);if(e.target.id==='search'){ui.query=e.target.value;$('#results').innerHTML=listHTML()}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,id=form.dataset.id,v=new FormData(form),name=String(v.get('name')||'').trim();run(async()=>{
if(form.id==='groupform'){const gid=id||uid();await change(d=>{groupName(d,name,id);if(id){const g=d.groups.find(g=>g.id===id);if(!g)throw Error('Group removed in another window.');Object.assign(g,{name,...readDates(v)})}else d.groups.push({id:gid,name,...readDates(v),closed:false})});dialog.close();navigate('group',gid)}
if(form.id==='taskform'){if(!name)throw Error('Enter a task name.');const tid=id||uid();await change(d=>{let gid=v.get('group');if(!gid||gid==='new'){const n=v.get('groupname').trim();groupName(d,n);gid=uid();d.groups.push({id:gid,name:n,...readDates(v,'group'),closed:false})}if(!d.groups.some(g=>g.id===gid))throw Error('Choose an existing group.');const fields={name,group:gid,...readDates(v),priority:v.get('priority'),remark:v.get('remark').trim()};if(id)Object.assign(freshTask(d,id),fields);else d.tasks.push({id:tid,...fields,done:false,closed:false,subs:[]})});detail(tid)}
if(form.id==='subform'||form.id==='editsubform'||form.matches('.inlineadd')){const quick=form.matches('.inlineadd'),tid=quick?form.dataset.parent:ui.task;if(!name)throw Error('Enter a subtask name.');await change(d=>{const t=freshTask(d,tid);if(quick||form.id==='subform'){t.subs.push({id:uid(),name,remark:(v.get('remark')||'').trim(),done:false,proof:''})}else Object.assign(freshSub(t,id),{name,remark:v.get('remark').trim()})});
  if(quick){inlineDrafts.delete(tid);const input=document.querySelector('.inlineadd[data-parent="'+tid+'"] input');if(input){input.value='';input.focus({preventScroll:true})}}
  else if(inlineSubDialog)dialog.close();
  else {detail(tid);if(form.id==='subform')dialog.querySelector('[name=name]').focus()}}
if(form.id==='exportform'){const chosen=new Set(v.getAll('chosen')),ts=data.tasks.filter(t=>chosen.has(t.id)&&t.due);if(!ts.length)throw Error('Select at least one dated task.');download(new Blob([ics(ts)],{type:'text/calendar;charset=utf-8'}),'Task-Tracker-deadlines.ics');notify('Calendar file downloaded.')}
})});
dialog.addEventListener('close',()=>{pendingBackup=null;inlineSubDialog=false});
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},30000);
render();init();
</script></body></html>
